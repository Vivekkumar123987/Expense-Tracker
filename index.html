<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker & Budget Analyzer</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1><i class="fa-solid fa-wallet"></i> Expense Tracker</h1>
            <p>Smart Personal Finance Manager</p>
        </header>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="card total">
                <h3>Total Balance</h3>
                <h2 id="totalBalance">₹0.00</h2>
            </div>
            <div class="card income">
                <h3>Total Income</h3>
                <h2 id="totalIncome">₹0.00</h2>
            </div>
            <div class="card expense">
                <h3>Total Expense</h3>
                <h2 id="totalExpense">₹0.00</h2>
            </div>
        </div>

        <!-- Main Layout Grid -->
        <div class="main-grid">
            <!-- Form Section -->
            <div class="form-card">
                <h3><i class="fa-solid fa-plus"></i> Add Transaction</h3>
                <form id="transactionForm">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g. Grocery Shopping" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" placeholder="e.g. 500" required min="1">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="type">Type</label>
                            <select id="type">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category">
                                <option value="Food">Food & Dining</option>
                                <option value="Rent">Rent & Bills</option>
                                <option value="Salary">Salary</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Add Entry</button>
                </form>
            </div>

            <!-- Chart Section -->
            <div class="chart-card">
                <h3><i class="fa-solid fa-chart-pie"></i> Expense Breakdown</h3>
                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Filter & Transaction List Section -->
        <div class="list-section">
            <div class="list-header">
                <h3><i class="fa-solid fa-list"></i> History</h3>
                <div class="actions">
                    <select id="filterCategory">
                        <option value="all">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Rent">Rent</option>
                        <option value="Salary">Salary</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Others">Others</option>
                    </select>
                    <button id="exportBtn" class="btn-secondary"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
                </div>
            </div>

            <ul id="transactionList" class="transaction-list">
                <!-- Items will be injected dynamically -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
